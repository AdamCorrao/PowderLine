# Read the Docs build configuration for PowderLine.
# https://docs.readthedocs.io/en/stable/config-file/v2.html
#
# Installs the package (its pyproject.toml runtime deps are light and pip-
# installable -- GSAS-II is NOT among them; it is a conda package declared in
# pixi.toml's [dependencies] and is mocked for autodoc in docs/conf.py) plus
# the doc-build-only deps in docs/requirements.txt.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/conf.py

python:
  install:
    - method: pip
      path: .
    - requirements: docs/requirements.txt
